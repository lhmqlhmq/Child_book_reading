<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7efe4">
  <title>在线故事 · 给孩子读书</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#33251e;background:#f7efe4}
    *{box-sizing:border-box}body{margin:0}.page{max-width:980px;margin:0 auto;padding:28px 18px 48px}
    h1{font-size:clamp(2rem,6vw,3.5rem);margin:0 0 8px}.intro{color:#7b6254;margin:0 0 22px}
    .back{display:inline-block;color:#885844;margin-bottom:22px}.stories{display:grid;gap:20px}
    .story{background:#fffaf5;border:1px solid #ead8c7;border-radius:24px;padding:18px;box-shadow:0 8px 24px #5b32120d}
    .story h2{font-size:1.25rem;margin:0 0 12px}.story iframe{display:block;width:100%;height:520px;border:0;border-radius:16px;background:#f1e2d2}
    .open{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:999px;background:#db7a55;color:#fff;text-decoration:none;font-weight:700}
    @media(max-width:600px){.page{padding:20px 12px 34px}.story{padding:12px;border-radius:18px}.story iframe{height:480px}}
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="/Child_book_reading/">← 返回书架</a>
    <h1>在线故事</h1>
    <p class="intro">故事来自原网站。页面允许时可直接在这里阅读和播放；如果没有显示，请点击“打开原网站”。</p>
    <section class="stories">
      <article class="story">
        <h2>Luister Mol</h2>

      </article>

      </article>
      <article class="story">

      </article>
    </section>
  </main>
</body>
</html>
