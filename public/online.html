<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7efe4">
  <title>在线故事 · 给孩子读书</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#33251e;background:#f7efe4}
    *{box-sizing:border-box}body{margin:0}.page{max-width:980px;margin:0 auto;padding:28px 18px 48px}
    h1{font-size:clamp(2rem,6vw,3.5rem);margin:0 0 8px}.intro{color:#7b6254;margin:0 0 22px}
    .back{display:inline-block;color:#885844;margin-bottom:22px}
    .stories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .story{background:#fffaf5;border:1px solid #ead8c7;border-radius:18px;box-shadow:0 8px 24px #5b32120d;overflow:hidden}
    .story summary{cursor:pointer;list-style:none;padding:17px 18px;font-size:1.05rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .story summary::-webkit-details-marker{display:none}.story summary::after{content:'＋';font-size:1.35rem;color:#c66d4d}.story[open] summary::after{content:'−'}
    .story-content{padding:0 14px 14px}.story iframe{display:block;width:100%;height:520px;border:0;border-radius:14px;background:#f1e2d2}
    .open{display:inline-block;margin-top:12px;padding:10px 15px;border-radius:999px;background:#db7a55;color:#fff;text-decoration:none;font-weight:700}
    @media(max-width:600px){.page{padding:20px 12px 34px}.stories{grid-template-columns:1fr}.story summary{padding:15px}.story-content{padding:0 10px 10px}.story iframe{height:480px}}
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="/Child_book_reading/">← 返回书架</a>
    <h1>在线故事</h1>
    <p class="intro">故事默认折叠，不会同时占满页面或加载所有网站。点击一个故事后，可在这里阅读和播放；如果没有显示，请点击“打开原网站”。</p>
    <section class="stories">
      <details class="story"><summary>Luister Mol</summary><div class="story-content"><iframe src="https://borre.nl/luister-mol/" title="Luister Mol 在线故事" loading="lazy"></iframe><a class="open" href="https://borre.nl/luister-mol/" target="_blank" rel="noopener noreferrer">打开原网站</a></div></details>
      <details class="story"><summary>Luister Loopneus</summary><div class="story-content"><iframe src="https://borre.nl/luister-loopneus/" title="Luister Loopneus 在线故事" loading="lazy"></iframe><a class="open" href="https://borre.nl/luister-loopneus/" target="_blank" rel="noopener noreferrer">打开原网站</a></div></details>
      <details class="story"><summary>Luister Boterhammen</summary><div class="story-content"><iframe src="https://borre.nl/luister-boterhammen/" title="Luister Boterhammen 在线故事" loading="lazy"></iframe><a class="open" href="https://borre.nl/luister-boterhammen/" target="_blank" rel="noopener noreferrer">打开原网站</a></div></details>
    </section>
  </main>
</body>
</html>
